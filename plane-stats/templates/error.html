<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a15">
  <title>{{ title }} · plane-stats</title>
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=1" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/app.css?v=2">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="bg" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="shell">
    <header class="hero">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.5 15.2v-1.9l-7.6-4.8V3.6a1.4 1.4 0 0 0-2.8 0v4.9L3.5 13.3v1.9l7.6-2.3v4.3l-2.3 1.7v1.4l3.7-1.1 3.7 1.1v-1.4l-2.3-1.7v-4.3z"/>
          </svg>
        </span>
        <div>
          <h1>{{ title }}</h1>
          <p class="tagline">{{ message }}<span class="meta">ADS-B</span></p>
        </div>
      </div>
      <div class="hero-tools">
        {% include "partials/nav.html" %}
      </div>
    </header>

    <main id="main">
      <section class="glass panel">
        <h2>What happened</h2>
        <p class="empty-note">{{ detail }}</p>
      </section>
    </main>

    <footer>LOCAL LEDGER · SQLITE · NO CLOUD</footer>
  </div>
</body>
</html>
