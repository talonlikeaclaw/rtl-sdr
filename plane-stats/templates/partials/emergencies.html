<table>
  <caption class="sr-only">Emergency squawks logged, most recent first</caption>
  <thead>
    <tr><th scope="col">Time</th><th scope="col">Hex</th><th scope="col">Squawk</th><th scope="col">Emergency</th></tr>
  </thead>
  <tbody>
    {% for e in emergencies %}
    <tr>
      <td>{{ e.ts_str() }}</td>
      <td class="hex"><a href="/aircraft/{{ e.hex }}">{{ e.hex }}</a></td>
      <td>{% if let Some(s) = e.squawk %}{{ s }}{% else %}-{% endif %}</td>
      <td class="emergency">{{ e.emergency }}</td>
    </tr>
    {% endfor %}
    {% if emergencies.is_empty() %}
    <tr><td colspan="4">No emergencies logged.</td></tr>
    {% endif %}
  </tbody>
</table>
