<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a15">
  <title>Coverage · plane-stats</title>
  <link rel="stylesheet" href="/app.css?v=2">
  <script src="/htmx.min.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="bg" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <div class="shell">
    <header class="hero">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.5 15.2v-1.9l-7.6-4.8V3.6a1.4 1.4 0 0 0-2.8 0v4.9L3.5 13.3v1.9l7.6-2.3v4.3l-2.3 1.7v1.4l3.7-1.1 3.7 1.1v-1.4l-2.3-1.7v-4.3z"/>
          </svg>
        </span>
        <div>
          <h1>Coverage</h1>
          <p class="tagline">Local receiver vs adsb.fi within {{ coverage.radius_nm }} NM.<span class="meta">ADS-B</span></p>
        </div>
      </div>
      <nav class="hero-actions" aria-label="Primary">
        <a class="pill" href="/">← Dashboard</a>
        <a class="pill" href="/today">Today</a>
        <a class="pill" href="/activity">Activity</a>
        <a class="pill" href="/types">Types</a>
        <a class="pill" href="{{ tar1090 }}/" target="_blank" rel="noopener">Open live map</a>
      </nav>
    </header>

    <main id="main">
      <section class="glass panel" aria-label="Coverage">
        <h2>Coverage</h2>
        <div id="coverage" hx-get="/partials/coverage"
             hx-trigger="every 10s [document.visibilityState === 'visible' && !(document.activeElement && document.activeElement.closest('#coverage'))]">
          {% include "partials/coverage.html" %}
        </div>
        <p id="coverage-live" class="sr-only" aria-live="polite"></p>
      </section>
    </main>

    <footer>LOCAL LEDGER · SQLITE · NO CLOUD</footer>
  </div>

  <script>
    // Announce the poll status after each swap without making the whole table
    // a live region. The refresh pauses while focus is inside #coverage, so a
    // keyboard user's place survives the 10 s tick.
    (() => {
      const live = document.getElementById("coverage-live");
      if (!live) return;
      let last = "";
      document.body.addEventListener("htmx:afterSwap", (e) => {
        if (e.detail.target.id !== "coverage") return;
        const status = e.detail.target.querySelector(".coverage-status");
        if (!status) return;
        const stale = status.classList.contains("stale");
        const key = stale ? "stale" : "ok";
        if (key === last) return;
        last = key;
        live.textContent = stale ? status.textContent.trim() : "Network data is live.";
      });
    })();
  </script>
</body>
</html>
