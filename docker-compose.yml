name: sdr

services:
  readsb:
    profiles: [adsb]
    # Upstream image lacks RTL-SDR Blog V4L support; see readsb-v4l/Dockerfile.
    build: ./readsb-v4l
    image: sdr/readsb-v4l:latest
    container_name: readsb
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run/readsb:size=64M
      - /var/log:size=32M
    volumes:
      - readsb_rrd:/run/collectd
      - readsb_autogain:/run/autogain
    ports:
      - "30005:30005"
      # Beast input for MLAT results (adsb.fi mlat-client runs on the host).
      - "127.0.0.1:30104:30104"
    environment:
      TZ: ${TZ}
      READSB_DEVICE_TYPE: rtlsdr
      READSB_ENABLE_BIASTEE: "on"
      READSB_DCFILTER: "true"
      READSB_FIX: "true"
      READSB_GAIN: autogain
      READSB_LAT: ${READSB_LAT}
      READSB_LON: ${READSB_LON}
      READSB_MAX_RANGE: "600"
      READSB_MODEAC: "true"
      READSB_RX_LOCATION_ACCURACY: "2"
      READSB_STATS_RANGE: "true"
      READSB_NET_ENABLE: "true"
      # Beast input: mlat-client injects results here (default image leaves it off).
      READSB_NET_BEAST_INPUT_PORT: "30104"

  tar1090:
    profiles: [adsb]
    image: ghcr.io/sdr-enthusiasts/docker-tar1090:latest
    container_name: tar1090
    restart: unless-stopped
    depends_on: [readsb]
    tmpfs:
      - /run:exec,size=256M
    volumes:
      # Heatmap, traces and the coverage/radar outline. Without this the data
      # lives in the container layer and every recreate wipes it.
      - tar1090_globe_history:/var/globe_history
    ports:
      - "8080:80"
    environment:
      TZ: ${TZ}
      BEASTHOST: readsb
      LAT: ${READSB_LAT}
      LONG: ${READSB_LON}
      # Load tar1090-db's aircraft.csv.gz into the internal readsb. Without it
      # readsb emits no `dbFlags` at all (military/interesting/PIA/LADD), and
      # plane-stats' flag chips stay empty.
      TAR1090_ENABLE_AC_DB: "true"
      # Persist per-airframe globe traces alongside the heatmap. One gzipped
      # JSON per day per aircraft, retained by MAX_GLOBE_HISTORY.
      READSB_ENABLE_TRACES: "true"
      MAX_GLOBE_HISTORY: "14"

  plane-stats:
    profiles: [adsb]
    build: ./plane-stats
    image: sdr/plane-stats:latest
    container_name: plane-stats
    restart: unless-stopped
    depends_on: [tar1090]
    volumes:
      - plane_stats_db:/data
      - /run/adsbfi-feed:/run/adsbfi-feed:ro
      - tar1090_globe_history:/globe_history:ro
    ports:
      - "8081:8081"
    environment:
      TZ: ${TZ}
      # Browser-facing tar1090 base; empty = derive from the request Host (:8080).
      TAR1090_URL: ${TAR1090_URL:-}
      # Receiver position for the live panel's bearing column.
      RX_LAT: ${READSB_LAT}
      RX_LON: ${READSB_LON}
      ADSB_FI_API: ${ADSB_FI_API:-https://opendata.adsb.fi/api}
      ADSB_FI_WEB_API: ${ADSB_FI_WEB_API:-https://api.adsb.fi}
      NETWORK_RADIUS_NM: ${NETWORK_RADIUS_NM:-100}
      NETWORK_POLL_SECS: ${NETWORK_POLL_SECS:-10}
      FEEDER_CHECK_SECS: ${FEEDER_CHECK_SECS:-35}
      NETWORK_STATS_SECS: ${NETWORK_STATS_SECS:-300}
      NETWORK_COVERAGE_SECS: ${NETWORK_COVERAGE_SECS:-600}
      FEED_JSON: /run/adsbfi-feed/aircraft.json
      ROUTE_LOOKUP: ${ROUTE_LOOKUP:-on}
      ROUTE_API: ${ROUTE_API:-https://api.adsbdb.com/v0}
      ROUTE_TTL_SECS: ${ROUTE_TTL_SECS:-604800}
      ROUTE_NEG_TTL_SECS: ${ROUTE_NEG_TTL_SECS:-2592000}
      ROUTE_POLL_SECS: ${ROUTE_POLL_SECS:-60}
      GLOBE_HISTORY: /globe_history

volumes:
  readsb_rrd:
  readsb_autogain:
  plane_stats_db:
  tar1090_globe_history:
